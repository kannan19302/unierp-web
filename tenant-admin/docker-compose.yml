services:
  tenant-admin:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tenant-admin
    ports:
      - "4006:4006"
    environment:
      - NODE_ENV=development
      - PORT=4006
      - NEXTAUTH_SECRET=tenant-admin-super-secret-key-2026
      - NEXTAUTH_URL=http://localhost:4006
      - NEXT_PUBLIC_PLATFORM_PORTAL=http://localhost:4003/home
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4006/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
